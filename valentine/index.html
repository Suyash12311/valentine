<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Will You Be My Valentine 💖</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(rgba(255,192,203,.6), rgba(255,192,203,.6)),
  url("./images/image1.jpeg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

@keyframes float {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-12px) scale(1.04); }
}

.image-animate {
  animation: float 4s ease-in-out infinite;
  transition: opacity .4s ease;
}

#noBtn {
  transition: all 0.25s ease;
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen overflow-hidden">

<div class="flex flex-col items-center text-center p-4">

<img id="imageDisplay"
src="./images/image2.jpeg"
class="rounded-2xl h-[520px] w-full object-cover mb-5 image-animate shadow-2xl" />

<audio id="bgMusic" loop>
  <source src="./music/Perfect.mp3" type="audio/mpeg">
</audio>

<h2 id="question" class="text-4xl font-bold italic text-pink-700 mb-6">
Will you be my Valentine, Angel? 💕
</h2>

<!-- BUTTONS -->
<div id="buttons" class="relative flex gap-6 mt-4 w-[300px] h-[90px] justify-center items-center">

  <button id="yesBtn"
    class="bg-green-500 hover:bg-green-400 text-white px-7 py-3 rounded-xl text-xl shadow-lg transition">
    Yes 💖
  </button>

  <button id="noBtn"
    class="bg-red-500 text-white px-7 py-3 rounded-xl text-xl shadow-lg">
    No 🙄
  </button>

</div>

<div id="finalMessage" class="hidden mt-6 text-3xl text-pink-700 font-bold">
  You’re officially my Valentine forever 💘🥹
</div>

<div id="spotify" class="hidden mt-6">
<iframe style="border-radius:12px"
src="https://open.spotify.com/embed/track/0tgVpDi06FyKpA1z0VMD4v"
width="300" height="80" allow="autoplay; encrypted-media"></iframe>
</div>

</div>

<script type="module">
import confetti from "https://cdn.skypack.dev/canvas-confetti";

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const image = document.getElementById("imageDisplay");
const question = document.getElementById("question");
const buttons = document.getElementById("buttons");
const finalMessage = document.getElementById("finalMessage");
const spotify = document.getElementById("spotify");
const music = document.getElementById("bgMusic");

const images = [
  "./images/image6.jpeg",
  "./images/image2.jpeg",
  "./images/image3.jpeg",
  "./images/image4.jpeg",
"./images/image5.jpeg",
"./images/image1.jpeg",
"./images/image7.jpeg",
"./images/image8.jpeg",
"./images/image9.jpeg",
"./images/image10.jpeg",
"./images/image11.jpeg",
"./images/image12.jpeg"

];

// Background music
document.addEventListener("click", () => {
  music.volume = 0.6;
  music.play();
}, { once: true });

// Image auto change
let index = 0;
setInterval(() => {
  index = (index + 1) % images.length;
  image.style.opacity = 0;
  setTimeout(() => {
    image.src = images[index];
    image.style.opacity = 1;
  }, 300);
}, 1800);

// No button run-away
noBtn.addEventListener("mouseenter", () => {
  const maxX = buttons.clientWidth - noBtn.clientWidth;
  const maxY = buttons.clientHeight - noBtn.clientHeight;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.position = "absolute";
  noBtn.style.left = `${x}px`;
  noBtn.style.top = `${y}px`;
});

// YES click
yesBtn.addEventListener("click", () => {
  question.textContent = "YAYYYY!! I KNEW IT 😭💘";
  buttons.style.display = "none";
  finalMessage.classList.remove("hidden");
  spotify.classList.remove("hidden");

  confetti({
    particleCount: 220,
    spread: 100,
    origin: { y: 0.6 }
  });
});
</script>

</body>
</html>
